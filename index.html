<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markgitup HTML Portal</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --card-bg: #161b22;
            --border-color: #30363d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--accent-color);
            font-size: 2.2em;
        }
        .entry {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .entry a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 1.1em;
        }
        .entry a:hover {
            text-decoration: underline;
        }
        .entry .timestamp {
            font-size: 0.9em;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Markgitup HTML Portal</h1>
            <div class="meta">Dynamic Research Synthesis Pages</div>
        </header>
        <div id="portal-entries"></div>
    </div>
    <script>
        fetch('manifest.json')
            .then(response => response.json())
            .then(data => {
                data.sort((a, b) => new Date(b.full_timestamp) - new Date(a.full_timestamp));
                const container = document.getElementById('portal-entries');
                data.forEach(entry => {
                    const div = document.createElement('div');
                    div.className = 'entry';
                    const fileUrl = entry.file.startsWith('html/') ? entry.file : 'html/' + entry.file;
                    div.innerHTML = `
                        <a href="${fileUrl}">${entry.topic}</a>
                        <div class="timestamp">${entry.full_timestamp}</div>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(err => {
                document.getElementById('portal-entries').innerHTML = '<p>Error loading manifest.</p>';
            });
    </script>
</body>
</html>
