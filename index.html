<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markgitup HTML Portal</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --card-bg: #161b22;
            --border-color: #30363d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--accent-color);
            font-size: 2.2em;
        }
        .meta {
            font-size: 0.9em;
            color: #8b949e;
        }
        .section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .page-list {
            list-style: none;
            padding: 0;
        }
        .page-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .page-item a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
        }
        .page-item a:hover {
            text-decoration: underline;
        }
        .page-item .timestamp {
            font-size: 0.85em;
            color: #8b949e;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Markgitup HTML Research Portal</h1>
            <div class="meta">Dynamic synthesis of AI & technology topics | Updated every 30 minutes</div>
        </header>

        <div class="section">
            <h2>📚 Research Synthesis Pages</h2>
            <p>Below is a dynamically generated list of all research synthesis webpages generated by the Markgitup HTML CronJob.</p>
            <ul class="page-list" id="page-list">
                <li>Loading manifest...</li>
            </ul>
        </div>
    </div>

    <script>
        async function loadManifest() {
            try {
                const response = await fetch('manifest.json');
                if (!response.ok) throw new Error('Manifest not found');
                const manifest = await response.json();
                
                const listContainer = document.getElementById('page-list');
                listContainer.innerHTML = '';
                
                manifest.sort((a, b) => new Date(b.full_timestamp) - new Date(a.full_timestamp));
                
                manifest.forEach(entry => {
                    const li = document.createElement('li');
                    li.className = 'page-item';
                    
                    const a = document.createElement('a');
                    a.href = entry.file;
                    a.textContent = entry.topic;
                    
                    const ts = document.createElement('div');
                    ts.className = 'timestamp';
                    ts.textContent = 'Generated: ' + entry.full_timestamp;
                    
                    li.appendChild(a);
                    li.appendChild(ts);
                    listContainer.appendChild(li);
                });
            } catch (error) {
                document.getElementById('page-list').innerHTML = '<li>Error loading manifest. Please check back later.</li>';
                console.error(error);
            }
        }
        
        loadManifest();
    </script>
</body>
</html>
